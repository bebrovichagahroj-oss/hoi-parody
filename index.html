<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Хойка-пародия: Гримания 1936</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --panel: rgba(22,23,14,.94); --line: #3d3c26; --gold: #d8c483;
    --text: #e9e3cd; --muted: #8e8a6e; --red: #b5463a; --green: #7f9b52;
  }
  html, body { height: 100%; overflow: hidden; background: #0c0d08; color: var(--text);
    font-family: "Segoe UI", system-ui, sans-serif; -webkit-user-select: none; user-select: none; }
  canvas { display: block; position: fixed; inset: 0; cursor: crosshair; }

  #topbar { position: fixed; top: 0; left: 0; right: 0; height: 70px; display: flex;
    align-items: center; gap: 16px; padding: 0 16px; z-index: 20;
    background: linear-gradient(180deg, #1b1c12 0%, #12130c 100%);
    border-bottom: 1px solid var(--line); box-shadow: 0 6px 24px rgba(0,0,0,.55); }
  .brand { display: flex; align-items: center; gap: 10px; min-width: 200px; }
  .flag { width: 38px; height: 26px; border-radius: 2px; border: 1px solid rgba(255,255,255,.3);
    box-shadow: 0 0 0 1px #000 inset; flex: 0 0 auto; }
  .brand h1 { font-family: Georgia, serif; font-size: 17px; letter-spacing: .07em; line-height: 1.1; }
  .brand .date { font-size: 10.5px; letter-spacing: .16em; color: var(--gold); text-transform: uppercase; margin-top: 3px; }

  .stats { display: flex; align-items: center; gap: 18px; flex: 1; justify-content: center; flex-wrap: wrap; }
  .stat { display: flex; align-items: baseline; gap: 5px; }
  .stat b { font-family: Georgia, serif; font-size: 17px; color: #f3ecd6; }
  .stat small { font-size: 9px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }

  .tension { min-width: 150px; text-align: right; }
  .tension span { font-size: 9px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
  .tbar { height: 7px; margin-top: 5px; background: #2a291b; border: 1px solid #47452d; border-radius: 4px; overflow: hidden; }
  .tbar i { display: block; height: 100%; width: 0%; transition: width .3s;
    background: linear-gradient(90deg, #6f8f4a, #c9a848 55%, #b5463a); }

  #side { position: fixed; top: 82px; right: 12px; bottom: 82px; width: 330px; z-index: 15;
    display: flex; flex-direction: column; gap: 10px; pointer-events: none; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 6px;
    box-shadow: 0 10px 30px rgba(0,0,0,.5); pointer-events: auto; overflow: hidden; }
  #tilePanel { flex: 0 0 auto; max-height: 62%; overflow-y: auto; padding: 13px; }
  #logPanel { flex: 1 1 auto; min-height: 90px; display: flex; flex-direction: column; }
  .panel-title { font-size: 10px; letter-spacing: .2em; text-transform: uppercase;
    color: var(--gold); padding: 9px 12px 7px; border-bottom: 1px solid var(--line); }
  #logList { overflow-y: auto; padding: 6px 10px 10px; font-size: 11.5px; line-height: 1.45; color: #beb99b; }
  #logList div { padding: 3px 0; border-bottom: 1px dotted rgba(255,255,255,.06); }
  #logList b { color: var(--gold); font-weight: 600; margin-right: 5px; font-size: 10px; }

  .ptitle { display: flex; gap: 9px; align-items: flex-start; margin-bottom: 10px; }
  .dot { width: 14px; height: 14px; border-radius: 2px; margin-top: 4px; border: 1px solid rgba(0,0,0,.6); flex: 0 0 auto; }
  .ptitle h2 { font-family: Georgia, serif; font-size: 17px; letter-spacing: .02em; line-height: 1.2; }
  .muted { color: var(--muted); font-size: 11px; }
  .kv { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; margin: 10px 0; }
  .kv div { background: rgba(255,255,255,.035); border: 1px solid rgba(255,255,255,.06);
    border-radius: 4px; padding: 6px 7px; }
  .kv span { display: block; font-size: 9px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
  .kv b { font-size: 14px; color: #f3ecd6; }
  .hint { font-size: 11px; color: var(--muted); line-height: 1.45; margin-top: 8px; }
  .hint b { color: #cfc8aa; }

  .btn { display: block; width: 100%; margin-top: 7px; padding: 9px 10px; cursor: pointer;
    font-family: inherit; font-size: 11.5px; letter-spacing: .06em; text-align: left;
    color: var(--text); background: linear-gradient(180deg, #2b2c1d, #1e1f13);
    border: 1px solid #4a4830; border-radius: 4px; transition: .12s; }
  .btn:hover:not(:disabled) { border-color: var(--gold); background: linear-gradient(180deg, #3a3a26, #262718); }
  .btn:disabled { opacity: .42; cursor: not-allowed; }
  .btn.primary { background: linear-gradient(180deg, #4f5f36, #354026); border-color: #71864a; }
  .btn.primary:hover:not(:disabled) { border-color: #a9c47a; }
  .btn.danger { background: linear-gradient(180deg, #663529, #44221a); border-color: #8d4a39; }
  .btn.danger:hover:not(:disabled) { border-color: #cf7263; }
  .btn .cost { float: right; color: #b9b18b; font-size: 10px; }
  .btn.ghost { background: transparent; text-align: center; }

  #bottombar { position: fixed; left: 0; right: 0; bottom: 0; height: 70px; z-index: 20;
    display: flex; align-items: center; gap: 10px; padding: 0 16px;
    background: linear-gradient(0deg, #1a1b11 0%, #12130c 100%);
    border-top: 1px solid var(--line); box-shadow: 0 -6px 24px rgba(0,0,0,.5); }
  .speed { display: flex; gap: 4px; margin-right: 8px; }
  .speed button { width: 42px; height: 34px; cursor: pointer; color: #cfc8aa; font-family: inherit;
    font-size: 12px; font-weight: 700; background: #202115; border: 1px solid #464430; border-radius: 4px; }
  .speed button:hover { border-color: var(--gold); }
  .speed button.active { background: #57623a; color: #fff8e2; border-color: #8fa464; }
  .spacer { flex: 1; }
  .tool { padding: 9px 15px; cursor: pointer; color: var(--text); font-family: inherit;
    font-size: 11px; letter-spacing: .1em; text-transform: uppercase;
    background: #23241a; border: 1px solid #4b4932; border-radius: 4px; }
  .tool:hover { border-color: var(--gold); color: #fff6d8; }
  .tool kbd { font-size: 9px; color: var(--muted); margin-left: 5px; }

  #modalWrap { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center;
    padding: 20px; background: radial-gradient(circle at 50% 40%, rgba(30,26,12,.55), rgba(5,5,3,.88));
    backdrop-filter: blur(4px); }
  #modalWrap.hidden { display: none; }
  .modal-card { width: min(720px, 100%); max-height: 88vh; overflow-y: auto; padding: 26px 30px;
    background: linear-gradient(165deg, #23241a, #14150d);
    border: 1px solid #5a5638; border-radius: 8px;
    box-shadow: 0 30px 90px rgba(0,0,0,.8), 0 0 60px rgba(216,196,131,.06) inset; }
  .modal-card.wide { width: min(860px, 100%); }
  .kicker { font-size: 10px; letter-spacing: .28em; text-transform: uppercase; color: var(--gold); margin-bottom: 8px; }
  .modal-card h2 { font-family: Georgia, serif; font-size: 26px; letter-spacing: .03em; margin-bottom: 12px; }
  .modal-card p { font-size: 13px; line-height: 1.6; color: #c4bfa3; margin-bottom: 10px; }
  .modal-card .btn { text-align: center; margin-top: 10px; }

  .focus-list { display: flex; flex-direction: column; gap: 9px; margin: 14px 0 4px; }
  .focus { padding: 12px 14px; border: 1px solid #45432e; border-radius: 5px;
    background: rgba(255,255,255,.025); }
  .focus.done { border-color: #4d5d33; background: rgba(90,110,50,.14); }
  .focus.active { border-color: var(--gold); box-shadow: 0 0 18px rgba(216,196,131,.1); }
  .focus.locked { opacity: .5; }
  .f-head { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; }
  .f-head b { font-family: Georgia, serif; font-size: 15px; color: #f0e9d0; }
  .f-head span { font-size: 10px; color: var(--muted); letter-spacing: .1em; white-space: nowrap; }
  .focus p { margin: 5px 0 0; font-size: 11.5px; color: #a9a488; }
  .focus .btn { width: auto; display: inline-block; margin-top: 8px; padding: 6px 14px; font-size: 10.5px; }
  .progress { height: 5px; margin-top: 8px; background: #2a291b; border-radius: 3px; overflow: hidden; }
  .progress i { display: block; height: 100%; background: linear-gradient(90deg, #7d8f4d, #d8c483); }

  table.diplo { width: 100%; border-collapse: collapse; margin: 12px 0; font-size: 12px; }
  table.diplo th { text-align: left; font-size: 9px; letter-spacing: .14em; text-transform: uppercase;
    color: var(--muted); font-weight: 600; padding: 6px 8px; border-bottom: 1px solid #3c3a26; }
  table.diplo td { padding: 8px; border-bottom: 1px solid rgba(255,255,255,.05); vertical-align: middle; }
  table.diplo tr.dead td { opacity: .35; text-decoration: line-through; }
  .status-war { color: #e0776a; font-weight: 700; font-size: 10.5px; letter-spacing: .08em; }
  .status-peace { color: #93a86b; font-size: 10.5px; letter-spacing: .08em; }
  .flagrow { display: flex; align-items: center; gap: 8px; }
  .flagrow i { display: block; width: 16px; height: 11px; border-radius: 1px; border: 1px solid rgba(0,0,0,.5); }
  table.diplo .btn { display: inline-block; width: auto; margin: 0 4px 0 0; padding: 5px 9px; font-size: 10px; }

  #toast { position: fixed; left: 50%; bottom: 88px; transform: translateX(-50%) translateY(10px);
    padding: 9px 18px; background: rgba(20,21,13,.95); border: 1px solid #6a6644; border-radius: 4px;
    font-size: 12px; color: #f0e9d0; opacity: 0; transition: .2s; pointer-events: none; z-index: 60; }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  #tooltip { position: fixed; z-index: 40; pointer-events: none; min-width: 150px; max-width: 230px;
    padding: 9px 11px; background: rgba(14,15,9,.96); border: 1px solid #57533a; border-radius: 4px;
    font-size: 11px; line-height: 1.45; color: #c8c3a7; box-shadow: 0 8px 22px rgba(0,0,0,.6); }
  #tooltip.hidden { display: none; }
  #tooltip b { display: block; color: #f2ebd3; font-family: Georgia, serif; font-size: 13px; margin-bottom: 2px; }
  #tooltip .t-war { color: #e0776a; }

  .battle-tag { display: inline-block; margin-top: 8px; padding: 5px 8px; border-radius: 3px;
    background: rgba(181,70,58,.16); border: 1px solid rgba(181,70,58,.5); font-size: 11px; color: #e6a79b; }

  .big-flag { width: 70px; height: 46px; border-radius: 3px; margin-bottom: 14px;
    border: 1px solid rgba(255,255,255,.25); box-shadow: 0 0 0 1px #000 inset; }
  .end-title { font-family: Georgia, serif; font-size: 40px; letter-spacing: .04em; margin: 4px 0 6px; }
  .end-title.win { color: #b9d98b; }
  .end-title.lose { color: #d96354; }
  .modal-card .stats-row { display: flex; gap: 26px; margin: 16px 0 4px; flex-wrap: wrap; }
  .stats-row div b { display: block; font-family: Georgia, serif; font-size: 22px; color: #f0e9d0; }
  .stats-row div span { font-size: 9px; letter-spacing: .16em; text-transform: uppercase; color: var(--muted); }

  @media (max-width: 980px) {
    #side { width: 290px; }
    .stats { gap: 11px; }
    .stat small { display: none; }
  }
</style>
</head>
<body>
<canvas id="map"></canvas>

<header id="topbar">
  <div class="brand">
    <div class="flag" id="playerFlag"></div>
    <div>
      <h1 id="playerName">Гримания</h1>
      <div class="date" id="dateLabel">1 января 1936</div>
    </div>
  </div>
  <div class="stats">
    <div class="stat"><b id="statPP">60</b><small>пол. власть</small></div>
    <div class="stat"><b id="statFactories">8</b><small>заводов</small></div>
    <div class="stat"><b id="statManpower">180 тыс.</b><small>людей</small></div>
    <div class="stat"><b id="statEquip">320</b><small>снаряж.</small></div>
    <div class="stat"><b id="statDivs">8</b><small>дивизий</small></div>
    <div class="stat"><b id="statProv">19</b><small>провинций</small></div>
  </div>
  <div class="tension">
    <span>мировая напряжённость</span>
    <div class="tbar"><i id="tensionFill"></i></div>
  </div>
</header>

<aside id="side">
  <div class="panel" id="tilePanel"></div>
  <div class="panel" id="logPanel">
    <div class="panel-title">Сводка с фронтов</div>
    <div id="logList"></div>
  </div>
</aside>

<footer id="bottombar">
  <div class="speed">
    <button data-speed="0" title="Пауза (пробел)">❚❚</button>
    <button data-speed="1" class="active" title="Скорость 1">▶</button>
    <button data-speed="2" title="Скорость 2">▶▶</button>
    <button data-speed="3" title="Скорость 3">▶▶▶</button>
  </div>
  <button class="tool" id="btnFocus">Фокусы<kbd>F</kbd></button>
  <button class="tool" id="btnDiplo">Дипломатия<kbd>D</kbd></button>
  <div class="spacer"></div>
  <button class="tool" id="btnSound">Звук: вкл</button>
  <button class="tool" id="btnHelp">Помощь<kbd>H</kbd></button>
</footer>

<div id="modalWrap" class="hidden"><div id="modal"></div></div>
<div id="toast"></div>
<div id="tooltip" class="hidden"></div>

<script src="game.js"></script>
</body>
</html>
